<text x="400" y="724" font-size="11.5" font-weight="400" fill="#1B2B45" text-anchor="start">asynchronous domain event</text>
<text x="1440" y="724" font-size="11.5" font-weight="400" fill="#33425C" text-anchor="end">Each service owns its own database. No service reads another service&#x27;s tables.</text>
<text x="44" y="750" font-size="11.5" font-weight="400" fill="#33425C" text-anchor="start">The streams profile adds two Kafka Streams topologies inside matching-service that read job-posted and application-submitted.</text>
