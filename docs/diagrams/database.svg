<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" width="1500" height="800" font-family="Inter, Helvetica, Arial, sans-serif" fill="#1B2B45" role="img" aria-label="CampusGig database design, one database per service">
<rect x="0" y="0" width="1500" height="800" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1B2B45" stroke-width="1.4"/></marker>
<marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0E7490" stroke-width="1.4"/></marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748B" stroke-width="1.4"/></marker>
<marker id="diamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="15" markerHeight="10" orient="auto"><path d="M1 5 L8 1 L15 5 L8 9 Z" fill="#1B2B45" stroke="#1B2B45"/></marker>
<marker id="odiamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="15" markerHeight="10" orient="auto"><path d="M1 5 L8 1 L15 5 L8 9 Z" fill="#FFFFFF" stroke="#1B2B45"/></marker>
<marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#1B2B45" stroke="#1B2B45"/></marker>
<marker id="solidT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0E7490" stroke="#0E7490"/></marker>
</defs>
<rect x="20" y="20" width="720" height="360" rx="10" fill="#F7F9FC" stroke="#B8C4D6" stroke-width="1.2"/><text x="36" y="46" font-size="15.5" font-weight="700">userdb</text><text x="36" y="64" font-size="11.5" fill="#475569">owned by user-service</text>
<rect x="760" y="20" width="720" height="360" rx="10" fill="#F7F9FC" stroke="#B8C4D6" stroke-width="1.2"/><text x="776" y="46" font-size="15.5" font-weight="700">jobdb</text><text x="776" y="64" font-size="11.5" fill="#475569">owned by job-service</text>
<rect x="20" y="400" width="720" height="360" rx="10" fill="#F7F9FC" stroke="#B8C4D6" stroke-width="1.2"/><text x="36" y="426" font-size="15.5" font-weight="700">applicationdb</text><text x="36" y="444" font-size="11.5" fill="#475569">owned by application-service</text>
<rect x="760" y="400" width="720" height="360" rx="10" fill="#F7F9FC" stroke="#B8C4D6" stroke-width="1.2"/><text x="776" y="426" font-size="15.5" font-weight="700">matchingdb</text><text x="776" y="444" font-size="11.5" fill="#475569">owned by matching-service · yellow tables are copies built from Kafka events</text>
<path d="M 105 250 L 105 210" fill="none" stroke="#1B2B45" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="117" y="223" width="20" height="15" fill="#F7F9FC" opacity="0.92"/>
<text x="127" y="234" text-anchor="middle" font-size="11" fill="#33425C">FK</text>
<path d="M 845 610 L 845 573" fill="none" stroke="#1B2B45" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="857" y="584" width="20" height="15" fill="#F7F9FC" opacity="0.92"/>
<text x="867" y="596" text-anchor="middle" font-size="11" fill="#33425C">FK</text>
<rect x="45" y="90" width="300" height="120" fill="#FFFFFF" stroke="#1B2B45" stroke-width="1.2"/>
<rect x="45" y="90" width="300" height="40" fill="#E8EEF6" stroke="#1B2B45" stroke-width="1.2"/>
<text x="195" y="105" text-anchor="middle" font-size="10.5" fill="#33425C">«table»</text>
<text x="195" y="122" text-anchor="middle" font-size="13.5" font-weight="700">student</text>
<text x="55" y="150" font-size="12">PK id: BIGINT</text>
<text x="55" y="167" font-size="12">name: VARCHAR</text>
<text x="55" y="184" font-size="12">email: VARCHAR, not null</text>
<text x="55" y="201" font-size="12">availability: VARCHAR (enum)</text>
<rect x="45" y="250" width="300" height="86" fill="#FFFFFF" stroke="#1B2B45" stroke-width="1.2"/>
<rect x="45" y="250" width="300" height="40" fill="#E8EEF6" stroke="#1B2B45" stroke-width="1.2"/>
<text x="195" y="265" text-anchor="middle" font-size="10.5" fill="#33425C">«table»</text>
<text x="195" y="282" text-anchor="middle" font-size="13.5" font-weight="700">student_skills</text>
<text x="55" y="310" font-size="12">FK student_id → student.id</text>
<text x="55" y="327" font-size="12">skill: VARCHAR</text>
<rect x="400" y="90" width="300" height="103" fill="#FFFFFF" stroke="#1B2B45" stroke-width="1.2"/>
<rect x="400" y="90" width="300" height="40" fill="#E8EEF6" stroke="#1B2B45" stroke-width="1.2"/>
<text x="550" y="105" text-anchor="middle" font-size="10.5" fill="#33425C">«table»</text>
<text x="550" y="122" text-anchor="middle" font-size="13.5" font-weight="700">employer</text>
<text x="410" y="150" font-size="12">PK id: BIGINT</text>
<text x="410" y="167" font-size="12">company_name: VARCHAR</text>
<text x="410" y="184" font-size="12">email: VARCHAR, not null</text>
<rect x="785" y="90" width="340" height="239" fill="#FFFFFF" stroke="#1B2B45" stroke-width="1.2"/>
<rect x="785" y="90" width="340" height="40" fill="#E8EEF6" stroke="#1B2B45" stroke-width="1.2"/>
<text x="955" y="105" text-anchor="middle" font-size="10.5" fill="#33425C">«table»</text>
<text x="955" y="122" text-anchor="middle" font-size="13.5" font-weight="700">job</text>
<text x="795" y="150" font-size="12">PK id: BIGINT</text>
<text x="795" y="167" font-size="12">employer_id: BIGINT  (an id in userdb)</text>
<text x="795" y="184" font-size="12">title: VARCHAR</text>
<text x="795" y="201" font-size="12">description: VARCHAR(2000)</text>
<text x="795" y="218" font-size="12">category: VARCHAR</text>
<text x="795" y="235" font-size="12">location: VARCHAR</text>
<text x="795" y="252" font-size="12">pay_amount: DECIMAL, not null</text>
<text x="795" y="269" font-size="12">pay_type: VARCHAR, not null</text>
<text x="795" y="286" font-size="12">status: VARCHAR (enum)</text>
<text x="795" y="303" font-size="12">posted_at: TIMESTAMP</text>
<text x="795" y="320" font-size="12">closed_at: TIMESTAMP</text>
<rect x="45" y="470" width="340" height="171" fill="#FFFFFF" stroke="#1B2B45" stroke-width="1.2"/>
<rect x="45" y="470" width="340" height="40" fill="#E8EEF6" stroke="#1B2B45" stroke-width="1.2"/>
<text x="215" y="485" text-anchor="middle" font-size="10.5" fill="#33425C">«table»</text>
<text x="215" y="502" text-anchor="middle" font-size="13.5" font-weight="700">job_application</text>
<text x="55" y="530" font-size="12">PK id: BIGINT</text>
<text x="55" y="547" font-size="12">job_id: BIGINT  (an id in jobdb)</text>
<text x="55" y="564" font-size="12">student_id: BIGINT  (an id in userdb)</text>
<text x="55" y="581" font-size="12">cover_message: VARCHAR(2000)</text>
<text x="55" y="598" font-size="12">status: VARCHAR (enum)</text>
<text x="55" y="615" font-size="12">submitted_at: TIMESTAMP</text>
<text x="55" y="632" font-size="12">updated_at: TIMESTAMP</text>
<rect x="785" y="470" width="320" height="103" fill="#FFFFFF" stroke="#1B2B45" stroke-width="1.2"/>
<rect x="785" y="470" width="320" height="40" fill="#FDEFC3" stroke="#1B2B45" stroke-width="1.2"/>
<text x="945" y="485" text-anchor="middle" font-size="10.5" fill="#33425C">«copy»</text>
<text x="945" y="502" text-anchor="middle" font-size="13.5" font-weight="700">student_snapshot</text>
<text x="795" y="530" font-size="12">PK student_id: BIGINT</text>
<text x="795" y="547" font-size="12">name: VARCHAR</text>
<text x="795" y="564" font-size="12">availability: VARCHAR</text>
<rect x="785" y="610" width="320" height="86" fill="#FFFFFF" stroke="#1B2B45" stroke-width="1.2"/>
<rect x="785" y="610" width="320" height="40" fill="#FDEFC3" stroke="#1B2B45" stroke-width="1.2"/>
<text x="945" y="625" text-anchor="middle" font-size="10.5" fill="#33425C">«copy»</text>
<text x="945" y="642" text-anchor="middle" font-size="13.5" font-weight="700">student_snapshot_skills</text>
<text x="795" y="670" font-size="12">FK student_id → student_snapshot</text>
<text x="795" y="687" font-size="12">skill: VARCHAR</text>
<rect x="1130" y="470" width="320" height="137" fill="#FFFFFF" stroke="#1B2B45" stroke-width="1.2"/>
<rect x="1130" y="470" width="320" height="40" fill="#FDEFC3" stroke="#1B2B45" stroke-width="1.2"/>
<text x="1290" y="485" text-anchor="middle" font-size="10.5" fill="#33425C">«copy»</text>
<text x="1290" y="502" text-anchor="middle" font-size="13.5" font-weight="700">job_snapshot</text>
<text x="1140" y="530" font-size="12">PK job_id: BIGINT</text>
<text x="1140" y="547" font-size="12">title: VARCHAR</text>
<text x="1140" y="564" font-size="12">description: VARCHAR(2000)</text>
<text x="1140" y="581" font-size="12">category: VARCHAR</text>
<text x="1140" y="598" font-size="12">location: VARCHAR</text>
<rect x="1130" y="625" width="320" height="120" fill="#FFFFFF" stroke="#1B2B45" stroke-width="1.2"/>
<rect x="1130" y="625" width="320" height="40" fill="#E8EEF6" stroke="#1B2B45" stroke-width="1.2"/>
<text x="1290" y="640" text-anchor="middle" font-size="10.5" fill="#33425C">«table»</text>
<text x="1290" y="657" text-anchor="middle" font-size="13.5" font-weight="700">notification</text>
<text x="1140" y="685" font-size="12">PK id: BIGINT</text>
<text x="1140" y="702" font-size="12">student_id: BIGINT  (an id in userdb)</text>
<text x="1140" y="719" font-size="12">message: VARCHAR(500)</text>
<text x="1140" y="736" font-size="12">created_at: TIMESTAMP</text>
<text x="20" y="788" font-size="12.5" fill="#33425C">No foreign key crosses a database: an id that belongs to another service is a plain column, and the copies in matchingdb are kept up to date from events, never by reading another database.</text>
</svg>
